name: test
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # A full shallow checkout: provider discovery reaches into top-level packages
      # (hermes_constants -> hermes_platform), so a sparse set silently breaks it.
      - name: Fetch a hermes-agent checkout
        run: git clone --depth 1 https://github.com/NousResearch/hermes-agent.git /tmp/hermes-agent
      - run: pip install pytest pyyaml
      - run: PYTHONPATH=/tmp/hermes-agent pytest -q
